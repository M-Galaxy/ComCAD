<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ComCAD</title>

<style>
  :root {
    /* LIGHT MODE (Default) */
    --bg: #f5f6f8;
    --surface: #ffffff;
    --border: #d8dde5;
    --text: #22252b;
    --muted: #6b7280;
    --accent: #3b82f6;
    --accent-hover: #2563eb;
    --danger: #ef4444;
  }

  /* DARK MODE */
  [data-theme="dark"] {
    --bg: #121417;
    --surface: #1b1e24;
    --border: #2d323b;
    --text: #e6e8ec;
    --muted: #8b92a0;
    --accent: #3b82f6;
    --accent-hover: #2563eb;
    --danger: #ef4444;
  }

  * {
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  body {
    background-color: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 24px;
    max-width: 720px;
    margin-inline: auto;
    transition: background-color 0.2s, color 0.2s;
  }

  /* Header */
  header {
    border-bottom: 1px solid var(--border);
    padding-bottom: 14px;
    margin-bottom: 24px;
  }

  .header-row {
    display: flex;
    align-items: baseline;
    gap: 12px;
    flex-wrap: wrap;
  }

  .header-row h1 {
    margin: 0;
    font-size: 26px;
    letter-spacing: -0.5px;
    color: var(--text);
  }

  .header-row span {
    font-size: 14px;
    color: var(--muted);
  }

  .production-tag {
    margin: 4px 0 0 0;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  /* Section Cards */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 18px;
    margin-bottom: 16px;
    transition: background-color 0.2s, border-color 0.2s;
  }

  .card h2 {
    margin: 0 0 14px 0;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--muted);
  }

  /* Radio & Checkbox rows */
  .option-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
    cursor: pointer;
    font-size: 14px;
  }

  input[type="radio"],
  input[type="checkbox"] {
    accent-color: var(--accent);
    cursor: pointer;
  }

  /* Inputs & Select */
  select,
  input[type="text"],
  textarea {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 14px;
    outline: none;
    transition: border-color 0.15s, background-color 0.2s, color 0.2s;
  }

  select:focus,
  input[type="text"]:focus,
  textarea:focus {
    border-color: var(--accent);
  }

  select {
    width: 100%;
    margin-top: 6px;
    cursor: pointer;
  }

  /* Developer-editable Context Description */
  .context-description {
    margin: 0 0 12px 0;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.5;
  }

  /* Context Input Group */
  .context-input-group {
    display: flex;
    gap: 8px;
  }

  .context-input-group input {
    flex: 1;
    min-width: 0;
  }

  .add-btn {
    background: var(--border);
    color: var(--text);
    border: none;
    border-radius: 6px;
    padding: 0 14px;
    font-size: 18px;
    cursor: pointer;
    transition: background 0.15s;
  }

  .add-btn:hover {
    background: var(--accent);
    color: #fff;
  }

  /* Context List */
  #myList {
    list-style: none;
    padding: 0;
    margin: 12px 0 0 0;
  }

  #myList li {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 12px;
    margin-bottom: 6px;
    font-size: 14px;
    overflow-wrap: anywhere;
  }

  .remove-btn {
    visibility: hidden;
    flex-shrink: 0;
    background: transparent;
    border: none;
    color: var(--muted);
    font-size: 16px;
    cursor: pointer;
    padding: 0 4px;
  }

  #myList li:hover .remove-btn,
  #myList li:focus-within .remove-btn {
    visibility: visible;
  }

  .remove-btn:hover {
    color: var(--danger);
  }

  /* Prompt & Generate */
  #fname {
    display: block;
    width: 100%;
    height: 130px;
    resize: vertical;
    line-height: 1.4;
  }

  #generateBtn {
    width: 100%;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 12px;
    margin-top: 12px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }

  #generateBtn:hover {
    background: var(--accent-hover);
  }

  /* Custom Dropdown */
  .dropdown {
    position: relative;
    width: 100%;
  }

  .dropdown-btn {
    width: 100%;
    text-align: left;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 9px 12px;
    font-size: 14px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }

  #dropdownLabel {
    overflow-wrap: anywhere;
  }

  .dropdown-content {
    display: none;
    position: absolute;
    bottom: 100%;
    left: 0;
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px;
    margin-bottom: 4px;
    z-index: 10;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
  }

  [data-theme="dark"] .dropdown-content {
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
  }

  .dropdown-content label {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 8px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 14px;
  }

  .dropdown-content label:hover {
    background: var(--bg);
  }

  .show {
    display: block;
  }

  /* Theme Switch */
  .theme-card {
    margin-top: 24px;
  }

  .theme-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .theme-description {
    font-size: 14px;
    color: var(--muted);
    margin: 0;
  }

  .theme-toggle {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 9px 14px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    transition: background-color 0.2s, border-color 0.2s;
  }

  .theme-toggle:hover {
    border-color: var(--accent);
  }

  @media (max-width: 480px) {
    body {
      padding: 16px;
    }

    .theme-row {
      align-items: flex-start;
      flex-direction: column;
    }
  }
</style>
</head>

<body>

<header>
  <div class="header-row">
    <h1>ComCAD</h1>
    <span>Your loyal AI comrade for CADing</span>
  </div>
  <p class="production-tag">TTM Co. Production</p>
</header>

<div class="card">
  <h2>Generation Type</h2>

  <label class="option-row">
    <input type="radio" id="modifyFile" name="generationMode" value="modify" checked>
    Modify existing files
  </label>

  <label class="option-row">
    <input type="radio" id="createFile" name="generationMode" value="create">
    Create new files
  </label>

  <select name="Selection" id="Selection">
    <option value="sketch">Sketch</option>
    <option value="studio">Part Studio</option>
    <option value="assembly">Assembly</option>
  </select>
</div>

<div class="card">
  <h2>Context</h2>

  <p id="contextDescription" class="context-description">
    Add your context description here. Edit this text directly in the HTML source.
  </p>

  <div class="context-input-group">
    <input
      type="text"
      id="itemInput"
      placeholder="Add assembly or part studio in context..."
      aria-label="Assembly or part studio to add"
    >
    <button
      type="button"
      class="add-btn"
      onclick="addItem()"
      aria-label="Add context item"
    >+</button>
  </div>

  <ul id="myList"></ul>
</div>

<div class="card">
  <h2>Prompt</h2>

  <textarea
    id="fname"
    name="fname"
    placeholder="Describe what you want to CAD..."
  ></textarea>

  <button type="button" id="generateBtn">Generate!</button>
</div>

<div class="card">
  <h2>Preferences</h2>

  <label class="option-row">
    <input type="checkbox" id="version" name="versionSet" value="createVersion">
    Create new version on generation
  </label>

  <div class="dropdown">
    <button
      type="button"
      class="dropdown-btn"
      onclick="toggleLibraryDropdown()"
      aria-expanded="false"
      aria-controls="libraryDropdown"
    >
      <span id="dropdownLabel">Part Libraries: None</span>
      <span aria-hidden="true">▲</span>
    </button>

    <div id="libraryDropdown" class="dropdown-content">
      <label>
        <input
          type="checkbox"
          id="libAll"
          value="All"
          onchange="toggleAllLibraries(this)"
        >
        All
      </label>

      <label>
        <input
          type="checkbox"
          class="lib-option"
          value="goBILDA"
          onchange="updateDropdownLabel()"
        >
        goBILDA
      </label>

      <label>
        <input
          type="checkbox"
          class="lib-option"
          value="REV"
          onchange="updateDropdownLabel()"
        >
        REV
      </label>

      <label>
        <input
          type="checkbox"
          class="lib-option"
          value="Tetrix"
          onchange="updateDropdownLabel()"
        >
        Tetrix
      </label>
    </div>
  </div>
</div>

<!-- Theme option at the bottom -->
<div class="card theme-card">
  <h2>Appearance</h2>

  <div class="theme-row">
    <p class="theme-description" id="themeDescription">
      Light mode is currently enabled.
    </p>

    <button
      type="button"
      class="theme-toggle"
      id="themeToggle"
      onclick="toggleTheme()"
    >
      <span class="theme-icon" id="themeIcon" aria-hidden="true">☀️</span>
      <span id="themeButtonText">Switch to Dark Mode</span>
    </button>
  </div>
</div>

<script>
  const itemInput = document.getElementById("itemInput");

  /* Context input */
  itemInput.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
      event.preventDefault();
      addItem();
    }
  });

  function addItem() {
    const text = itemInput.value.trim();

    if (text !== "") {
      const li = document.createElement("li");
      li.append(document.createTextNode(text));

      const removeBtn = document.createElement("button");
      removeBtn.textContent = "×";
      removeBtn.type = "button";
      removeBtn.className = "remove-btn";
      removeBtn.setAttribute("aria-label", "Remove " + text);
      removeBtn.onclick = () => li.remove();

      li.appendChild(removeBtn);
      document.getElementById("myList").appendChild(li);
      itemInput.value = "";
    }
  }

  /* Part Libraries dropdown */
  function toggleLibraryDropdown() {
    const dropdown = document.getElementById("libraryDropdown");
    const button = document.querySelector(".dropdown-btn");
    const isOpen = dropdown.classList.toggle("show");
    button.setAttribute("aria-expanded", String(isOpen));
  }

  function toggleAllLibraries(allCheckbox) {
    document.querySelectorAll(".lib-option").forEach(checkbox => {
      checkbox.checked = allCheckbox.checked;
    });

    updateDropdownLabel();
  }

  function updateDropdownLabel() {
    const options = Array.from(document.querySelectorAll(".lib-option"));
    const checked = options.filter(checkbox => checkbox.checked);
    const allBox = document.getElementById("libAll");

    // All is checked only when every individual library is checked.
    allBox.checked = options.length > 0 && checked.length === options.length;

    // Do not show the indeterminate horizontal-line state.
    allBox.indeterminate = false;

    const label = document.getElementById("dropdownLabel");

    if (checked.length === 0) {
      label.textContent = "Part Libraries: None";
    } else {
      label.textContent = "Part Libraries: " + checked.map(checkbox => checkbox.value).join(", ");
    }
  }

  /* Theme system */
  function setTheme(theme) {
    document.documentElement.setAttribute("data-theme", theme);

    try {
      localStorage.setItem("comcad-theme", theme);
    } catch (error) {
      // The theme still works for this session if storage is unavailable.
    }

    updateThemeButton(theme);
  }

  function toggleTheme() {
    const currentTheme =
      document.documentElement.getAttribute("data-theme") || "light";

    setTheme(currentTheme === "light" ? "dark" : "light");
  }

  function updateThemeButton(theme) {
    const themeIcon = document.getElementById("themeIcon");
    const themeButtonText = document.getElementById("themeButtonText");
    const themeDescription = document.getElementById("themeDescription");

    if (theme === "dark") {
      themeIcon.textContent = "🌙";
      themeButtonText.textContent = "Switch to Light Mode";
      themeDescription.textContent = "Dark mode is currently enabled.";
    } else {
      themeIcon.textContent = "☀️";
      themeButtonText.textContent = "Switch to Dark Mode";
      themeDescription.textContent = "Light mode is currently enabled.";
    }
  }

  function initializeTheme() {
    let savedTheme = "light";

    try {
      savedTheme = localStorage.getItem("comcad-theme") || "light";
    } catch (error) {
      // Use light mode when local storage is unavailable.
    }

    setTheme(savedTheme === "dark" ? "dark" : "light");
  }

  /* Initialize controls */
  updateDropdownLabel();
  initializeTheme();
</script>

</body>
</html>
